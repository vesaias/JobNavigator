              - generic [ref=e203]:
                - generic [ref=e204]: 简历注册时是否应该勾选“同意岗位调剂”？
                - paragraph [ref=e206]: 建议您勾选“同意岗位调剂”。公司将优先根据您所投递的岗位进行简历评估和面试安排。如面试不通过或投递岗位满额，公司将根据您的专业背景做合适岗位推荐。
            - generic [ref=e207]:
              - img [ref=e209]
              - generic [ref=e210]:
                - generic [ref=e211]: 填写简历时有哪些注意事项？
                - generic [ref=e212]:
                  - paragraph [ref=e213]: 1、请务必仔细填写并核对您的个人基本信息：姓名、证件号码、联系方式、邮箱地址等。一经注册将无法变更，如信息错误，将会直接影响您应聘结果有效性。
                  - paragraph [ref=e214]: 2、注册证件：中国大陆候选人请使用身份证注册；中国港澳台候选人请使用往来内地通行证/往来大陆通行证进行注册；非中国籍候选人请使用护照进行注册。
                  - paragraph [ref=e215]: 3、教育经历：请按照由近及远、由高到低的顺序完善教育经历。
                  - paragraph
                  - paragraph [ref=e216]: 4、在校经历：建议充分完善您的在校经历，以加深面试官的第一印象。
            - generic [ref=e217]:
