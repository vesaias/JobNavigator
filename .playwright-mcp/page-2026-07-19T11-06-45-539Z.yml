        - paragraph [ref=e243]: 莉莉丝游戏于2013年创立于上海，是集游戏研发与全球发行于一体的游戏公司。
        - paragraph [ref=e244]: 陆续推出《小冰冰传奇》《剑与远征》《万国觉醒》《剑与远征：启程》等爆款游戏，在全球市场积累了广泛的用户基础和良好口碑，是中国游戏公司出海代表之一。
        - paragraph [ref=e245]: 莉莉丝秉持“简单真诚”的价值观，以“深度本地化”为核心战略，凭借深厚的出海经验和服务化经验，重视玩家声音，致力于为全世界玩家提供超越预期的游戏体验。目前在全球拥有超过2300名员工，于新加坡、韩国、美国等地设有分支机构。
        - paragraph [ref=e246]: 莉莉丝将持续投入研发创新，不断探索多元化的艺术风格，通过优质内容连接全球玩家，努力实现“成为世界一流的游戏公司”的愿景。
