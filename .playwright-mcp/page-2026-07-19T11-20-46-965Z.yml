        - generic [ref=e47]:
          - heading "[岗位描述]" [level=1] [ref=e48]
          - paragraph
          - paragraph [ref=e49]: 1、活动规划与执行：根据游戏阶段目标，制定活动排期和资源投放规划，把控整体活动节奏，确保收入目标达成，包含但不限于付费活动、活跃活动、渠道活动等；
          - paragraph [ref=e50]: 2、活动设计与执行：深度挖掘用户诉求，拓展游戏内商业化空间，能够结合营收情况和活动计划，撰写活动策划方案与相关功能玩法设计方案，并推进开发；
          - paragraph [ref=e51]: 3、活动效果复盘与迭代：有良好的逻辑思维与数据分析能力，及时跟踪分析活动各项数据指标，能够输出有效结论和调优策略，有针对性的进行迭代调优；
          - paragraph [ref=e52]: 4、活动内容设计：负责设计游戏内外的付费相关内容，包括但不限于：奖励投放、礼包规划等；
          - paragraph [ref=e53]: 5、竞品调研与分享：外部产品相关活动调研，形成规范化调研文档，用于自身产品活动的优化。
          - paragraph [ref=e54]: 6、根据业务发展及项目安排，有机会参与海外版本相关运营工作。
          - paragraph
          - heading "[岗位要求]" [level=1] [ref=e55]
          - paragraph
          - paragraph [ref=e56]: 1、对于数值敏感，善于挖掘产品付费点改善数据，可根据数据分析和用户反馈快速调整活动提升效果，并有较好的分析总结能力；
          - paragraph [ref=e57]: 2、具有良好的逻辑思维能力、乐于尝试与创新，愿意接受新挑战；
          - paragraph [ref=e58]: 3、具有极强的责任心和主动性，善于学习，对于营收抗压能力强；
          - paragraph [ref=e59]: 4、可实习时间3个月以上、每周4天以上者优先考虑。
