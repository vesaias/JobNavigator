              - link "实习-AI应用开发/后端研发实习生 合肥、上海 校招 实习 数字技术 - 软件研发 本科及以上 蔚来2027届实习生招募 职位 ID：A173976 1.参与构建基于大语言模型的 AI Agent，参与整车研发相关软件平台/内部管理系统等及工具的设计与开发，支撑公司产研效能数字化相关业务。 2.深度参与业务需求评审、技术方案设计与代码审查，编写高复用性核心代码，确保任务的高质量交付与敏捷迭代。 3.协同团队持续重构优化系统核心链路，保障系统稳定性与可扩展能力。 4.追踪Agent推理、多智能体协作等前沿技术，并推动在研发提效场景的工程化落地。" [ref=e727] [cursor=pointer]:
