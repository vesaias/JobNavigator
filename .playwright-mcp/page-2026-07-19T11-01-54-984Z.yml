                  - generic [ref=e748]: 1.参与构建基于大语言模型的 AI Agent，参与整车研发相关软件平台/内部管理系统等及工具的设计与开发，支撑公司产研效能数字化相关业务。 2.深度参与业务需求评审、技术方案设计与代码审查，编写高复用性核心代码，确保任务的高质量交付与敏捷迭代。 3.协同团队持续重构优化系统核心链路，保障系统稳定性与可扩展能力。 4.追踪Agent推理、多智能体协作等前沿技术，并推动在研发提效场景的工程化落地。
              - link "提前批-AI平台研发工程师 上海、合肥 校招 正式 数字技术 - 软件研发 本科及以上 2027届校园招聘-技术提前批 职位 ID：A09422 你会做什么 你将参与 Skyworks AI 平台的核心研发工作，和团队一起构建企业级 Agent 平台、知识平台、数据语义层和能力市场。 你可能参与的项目包括： 开发 Agent 编排与执行引擎 支持 Agent 的任务拆解、工具调用、知识检索、多步骤执行、结果聚合和运行日志记录。 开发 Agent 搭建平台后端能力 为前端配置界面提供 API，支持用户创建 Agent、选择知识源、绑定工具、配置执行流程。 开发知识与语义层能力 参与 Ontology 建模、知识图谱查询、数据表语义映射等能力建设，让 Agent 能够理解企业业务对象和数据关系。 开发跨数据源查询能力 支持 Agent 查询结构化数据、知识图谱、向量库和文档知识，实现多源信息融合。 建设企业能力市场 参与 SkillHub / AgentsMarket 开发，让企业内部工具、API、Agent 能力可以被发布、搜索、复用和治理。 参与平台工程化建设 包括权限、日志、监控、任务调度、运行追踪、可观测性等企业级平台能力。 你会接触的技术 后端开发：Python / Java / Go Web 框架：FastAPI / Django / Spring Boot 数据库：PostgreSQL / MySQL / Redis 图数据库：Neo4j / JanusGraph 向量数据库：Milvus / Qdrant / Weaviate Agent 框架：LangChain / LangGraph / LlamaIndex 消息队列：Kafka / RabbitMQ 容器化：Docker / Kubernetes 可观测性：Prometheus / Grafana / Langfuse 不要求你全部掌握，但希望你有扎实的编程基础和快速学习能力。" [ref=e749] [cursor=pointer]:
