          - generic [ref=e179]:
            - paragraph [ref=e180]: 做游戏就像玩游戏：像钻研攻略一样去拆解规则，像构筑Build一样去设计系统，像养成心爱角色一样去打磨细节。期待你来造一个让自己热血沸腾、也让玩家沉浸其中的世界。
            - paragraph [ref=e181]: 阿翔-23届-中山大学-游戏策划
          - generic [ref=e184]:
            - paragraph [ref=e185]: 把脑海中的角色创造出来是件很有意思的事，看到自己画的角色被制作出来，出现在游戏中，感觉很奇妙，好像它突然活了过来，在另一个世界有了自己的生活。
            - paragraph [ref=e186]: 阿婷-19届-吉林动画学院-角色原画
          - generic [ref=e189]:
            - paragraph [ref=e190]: 从事海外发行，像开始了一场环球旅行，可以不断开阔全球化视野，感受多元文化的差异，洞察各国玩家的思维习惯。通过钻研玩家的本质需求，实现有意义的想法，为全世界玩家带来持久耐玩的好游戏！
            - paragraph [ref=e191]: Andy-20届-中山大学-海外运营
        - listitem [ref=e192]:
          - generic [ref=e195]:
            - paragraph [ref=e196]: 引擎之下，万物有序。入职至今，我所做的是在像素与逻辑之间，寻找那个恰到好处的平衡点。技术如川，奔流不息，所幸此间不乏同行者。若你亦是心中有火、眼里有光之人，这里值得你落笔。
            - paragraph [ref=e197]: 阿杰-25届-华南理工大学-游戏开发
          - generic [ref=e200]:
            - paragraph [ref=e201]: 一直被鼓励着珍视自己的心流体验、大胆发出自己的声音，能够心无旁骛地投入到事情本身，伴随着认知边界的逐渐拓宽，看到一步一脚印的成长。成为一名HR，也许不是那么“好玩”，但一定收获满满！
            - paragraph [ref=e202]: 东东-25届-厦门大学-HR
          - generic [ref=e205]:
            - paragraph [ref=e206]: 我们总说"未来已来"，在游戏行业，我每天感受到的未来，就是AI与创意并肩工作：它让灵感更快落地，让想象更敢被实现。如果你也是会做梦、且能把梦做成作品的人，加入我们，一起携手AI，把未来做出来。
            - paragraph [ref=e207]: 茶马-22届-中山大学-广告创意
