name: Images

# Builds multi-arch (linux/amd64 + linux/arm64, arm64 under QEMU) backend and
# frontend images and publishes them to GHCR on every version tag so a clone can
# `docker compose pull` instead of building Playwright's Chromium for five minutes.
# Releases are tagged major.minor: v3.0 → :3.0 and :latest. An older three-part tag
# (v2.2.0) still gives :2.2.0, :2.2 and :latest. type=semver is not used because it
# skips a two-part tag. `workflow_dispatch` publishes only :edge from whatever ref
# it runs on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
          - name: frontend
            dockerfile: Dockerfile.frontend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/jobnavigator-${{ matrix.name }}
          tags: |
            type=match,pattern=^v(\d+\.\d+)(\.\d+)?$,group=1
            type=match,pattern=^v(\d+\.\d+\.\d+)$,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
