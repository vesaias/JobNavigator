x-cli-runner: &cli-runner
  restart: unless-stopped
  init: true
  networks: [llm]
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_USER: jobnavigator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: jobnavigator
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobnavigator"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Prebuilt on every release (ghcr.io, .github/workflows/images.yml): `docker compose pull`
    # skips the Chromium build. `docker compose up --build` still builds from source.
    image: ghcr.io/vesaias/jobnavigator-backend:${JN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    networks: [default, llm]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobnavigator:${POSTGRES_PASSWORD:-password}@db:5432/jobnavigator
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      JN_RUNNER_MANAGEMENT: ${JN_RUNNER_MANAGEMENT:-1}
      JN_RUNNER_MANAGER_URL: http://runner-manager:8000
    ports:
      - "127.0.0.1:8000:8000"   # everything external goes through Caddy on :80; the raw API stays on loopback
    depends_on:
      db:
        condition: service_healthy
      runner-manager:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - ./backups:/app/backups
      # Read-only: the update check (backend/update_check.py) reads the running commit from it.
      - ./.git:/app/.git:ro
      - ./backend/.linkedin_api:/root/.linkedin_api
      - codex_auth:/root/.codex
      # agy keeps its OAuth token in a file here; no keyring in this image.
      - antigravity_auth:/root/.gemini
      # Shared for account removal even while a runner is stopped.
      - claude_accounts:/root/.claude-accounts
      - runner_control:/run/jobnavigator-runner

  runner-manager:
    image: ghcr.io/vesaias/jobnavigator-runner-manager:${JN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.runner-manager
    restart: unless-stopped
    init: true
    networks: [llm]
    environment:
      # Empty = read from the manager's own container (the folder name unless COMPOSE_PROJECT_NAME is set)
      JN_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-}
      JN_RUNNER_MANAGEMENT: ${JN_RUNNER_MANAGEMENT:-1}
      JN_IMAGE_TAG: ${JN_IMAGE_TAG:-latest}
      JN_RUNNER_IMAGE_PREFIX: ${JN_RUNNER_IMAGE_PREFIX:-ghcr.io/vesaias/jobnavigator}
      JN_RUNNER_MEMORY_MB: ${JN_RUNNER_MEMORY_MB:-0}
      JN_RUNNER_IDLE_MINUTES: ${JN_RUNNER_IDLE_MINUTES:-10}
    volumes:
      # Only this restricted controller receives the Docker socket.
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_control:/run/jobnavigator-runner:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  codex-runner:
    <<: *cli-runner
    image: ghcr.io/vesaias/jobnavigator-codex-runner:${JN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.runner
      target: codex-runner
    profiles: [codex, llm]
    volumes:
      - codex_auth:/root/.codex
      - runner_control:/run/jobnavigator-runner:ro

  claude-runner:
    <<: *cli-runner
    image: ghcr.io/vesaias/jobnavigator-claude-runner:${JN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.runner
      target: claude-runner
    profiles: [claude, llm]
    volumes:
      - claude_accounts:/root/.claude-accounts
      - runner_control:/run/jobnavigator-runner:ro

  antigravity-runner:
    <<: *cli-runner
    image: ghcr.io/vesaias/jobnavigator-antigravity-runner:${JN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.runner
      target: antigravity-runner
    profiles: [antigravity, llm]
    volumes:
      - antigravity_auth:/root/.gemini
      - runner_control:/run/jobnavigator-runner:ro

  frontend:
    image: ghcr.io/vesaias/jobnavigator-frontend:${JN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # No published port: Caddy reaches this container over the compose network (frontend:80), and a
    # host port only invites clashes (Windows reserves ranges around 3000 for Hyper-V after a restart).
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  codex_auth:
  antigravity_auth:
  claude_accounts:
  runner_control:

networks:
  llm:
