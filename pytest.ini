[pytest]
asyncio_mode = auto
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    live: hits the running stack over HTTP (read-only); auto-skips when unreachable
    real_workday_client: use the real curl_cffi Workday client instead of the httpx test double
